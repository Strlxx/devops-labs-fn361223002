- hosts: web
  become: true

  vars:
    database_url: postgresql://notes:notes@db:5432/notes

  handlers:
    - name: Restart notes
      ansible.builtin.systemd:
        name: notes
        state: restarted

  tasks:
    - name: Install web packages
      ansible.builtin.apt:
        name:
          - python3-venv
          - python3-packaging
          - git
        state: present
        update_cache: true

    - name: Clone repository
      ansible.builtin.git:
        repo: https://github.com/Strlxx/devops-labs-fn361223002.git
        dest: /opt/notes
        version: main
      notify: Restart notes

    - name: Install requirements
      ansible.builtin.pip:
        requirements: /opt/notes/requirements.txt
        virtualenv: /opt/notes/.venv
        virtualenv_command: python3 -m venv

    - name: Install systemd service
      ansible.builtin.template:
        src: templates/notes.service.j2
        dest: /etc/systemd/system/notes.service
      notify: Restart notes

    - name: Enable and start notes
      ansible.builtin.systemd:
        name: notes
        state: started
        enabled: true
        daemon_reload: true